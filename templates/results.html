<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Place Name Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', path='styles.css')}}">

    <meta property="og:title" content="The Place Name Game: Results" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://the.piggypiggyyoinkyoink.website" />
    <meta property="og:image" content="{{url_for('static', path='image.png')}}" />
    <meta property="og:description" content="{{name}} successfully named {{count}} in {{type}}. &#x0A; Can you do better?" />
    <meta property="og:site_name" content="The Place Name Game" />
    <link rel="icon" type="image/png" href="./static/piggy.png">
</head>
<body>
    <div class = "loading" id = "loading">
        <img src="{{url_for('static', path='loading_map.gif')}}" alt="Loading..." style = "width: 50%;">
        <h2 id = "loadingText">Loading</h2>
    </div>
    <div id = "main" style = "display: none;">
        <div class = "top">
            <h1 id = "h1">Loading...</h1>
                    <p id = "details"></p>
            
        </div>
        <div class = "container">
            <div class = "row">
                <div class = "col-lg-auto c">
                    <svg id="map" width="600" height="750"></svg>
                </div>
                <div class = "col-lg-4 c" id="r">
                    <h3 id = "placesHeader">Places Entered</h3>
                    <table class = "table table-striped" id = "placesTableHeader">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Place</th>
                            </tr>
                        </thead>
                    </table>
                    <div id = "tableContainer" style="max-height: 630px;">
                        <table class = "table table-striped" id = "placesTable">
                            <thead>
                                <tr>
                                    
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </div>
            <div class = "btncontainer">
                <button class="btn btn-primary" id="homeButton" onclick="window.location.href='./'">Go to Home</button>
                <button class="btn btn-success" id="newGameButton">New Game</button>
            </div>
        </div>
        <br><br>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="{{url_for('static', path='results.js')}}"></script>
</body>
</html>
